<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="The Roster: a daily draft game. One topic, five subtopics, draft the best roster against friends or AI."><meta property="og:title" content="The Roster"><meta property="og:description" content="Today's topic is live. Draft the best roster and prove your friends wrong."><meta name="theme-color" content="#f7f2e7"><meta property="og:type" content="website"><meta property="og:url" content="https://playtheroster.github.io/"><meta property="og:site_name" content="The Roster"><meta property="og:image" content="https://playtheroster.github.io/og-image-2.png"><meta property="og:image:secure_url" content="https://playtheroster.github.io/og-image-2.png"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="The Roster logo: a gold number 01 jersey on black"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="The Roster"><meta name="twitter:description" content="Today's topic is live. Draft the best roster and prove your friends wrong."><meta name="twitter:image" content="https://playtheroster.github.io/og-image-2.png"><link rel="icon" type="image/png" sizes="32x32" href="https://playtheroster.github.io/jersey-32.png"><link rel="icon" type="image/png" sizes="64x64" href="https://playtheroster.github.io/jersey-64.png"><link rel="icon" type="image/png" sizes="192x192" href="https://playtheroster.github.io/jersey-192.png"><link rel="icon" type="image/png" sizes="512x512" href="https://playtheroster.github.io/jersey-512.png"><link rel="apple-touch-icon" sizes="180x180" href="https://playtheroster.github.io/jersey-apple-180.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<title>The Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700;800&display=swap">
<style id="app-style">
/* Layout: game-night draft page. Hero with today's topic, the live game console, then rules and scoring. Chunky rounded display type on an ivory ground with broadcast black, gold and crimson, pressable buttons with offset shadows. */
/* Draft Night, light: ivory ground with broadcast black, gold and crimson for buttons, headers and highlights. */
:root {
  --bg: #f7f2e7;
  --surface: #ffffff;
  --ink: #141210;
  --muted: #6b6252;
  --line: #e6dcc6;
  --edge: #141210;
  --drop: #141210;
  --accent: #141210;
  --accent-ink: #e8b931;
  --pop: #d7263d;
  --hi: #e8b931;
  --hi-ink: #141210;
  --tint: #f2ead6;
  --bad: #b01e33;
  --good: #11713a;
  --dot: rgba(20, 18, 16, 0.07);
  --deep: #141210;
  --deep-ink: #e8b931;
  --grad-a: #e8b931;
  --grad-b: #f3cb4f;
  --grad-ink: #141210;
  --shadow: rgba(20, 18, 16, 0.2);
  /* player colors */
  --p0: #2457e6; --p1: #c0267f; --p2: #0b8797; --p3: #7b3fe4; --p4: #8a5a2b; --p5: #737d8e; --p6: #0f9fe0; --p7: #10131c; --p-ink: #ffffff;
  /* score tiers: dark green, light green, yellow, orange, red */
  --g5: #16733a; --g5-ink: #ffffff; --g4: #7cc957; --g4-ink: #10131c; --g3: #f5c935; --g3-ink: #10131c; --g2: #f28c28; --g2-ink: #10131c; --g1: #d63a2f; --g1-ink: #ffffff;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { width: min(1160px, 100%); margin-inline: auto; padding-inline: 16px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
a { color: inherit; }

.mono { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; line-height: 0.92; letter-spacing: 0.005em; }
.mark { background: var(--hi); color: var(--hi-ink); padding: 0 0.14em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 10px; border: 2px solid var(--edge); background: transparent; font-weight: 700; font-size: 0.98rem; transition: transform 0.12s ease; text-decoration: none; }
.btn:hover { transform: translateY(-2px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 0.88rem; }
.btn.ghost { border-color: transparent; }
.btn.block { width: 100%; }
.field { width: 100%; min-height: 46px; padding: 0 14px; border: 2px solid var(--edge); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
.field::placeholder { color: var(--muted); }
select.field { padding-right: 8px; }
.label { display: block; margin-bottom: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .field { flex: 1 1 160px; min-width: 0; }
.note { color: var(--muted); font-size: 0.9rem; }
.note.bad, .bad-text { color: var(--bad); }

/* Nav */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 16px; min-width: 0; }
.wordmark { font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; text-decoration: none; }
.wordmark i { font-style: normal; color: var(--accent); }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 48px; align-items: center; padding-block: 44px 64px; }
.lede { max-width: 34rem; margin-top: 24px; font-size: 1.12rem; color: var(--muted); }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }

.topic { background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; overflow: hidden; box-shadow: 8px 8px 0 var(--drop); }
.topic-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 20px; background: var(--ink); }
.topic-head .mono { color: var(--bg); }
.topic-body { padding: 22px 20px 20px; }
.topic-title { font-size: clamp(2.4rem, 12vw, 6.6rem); overflow-wrap: anywhere; }
.subs-label { margin-top: 20px; }
.subs-hidden { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 14px; background: var(--tint); border-radius: 10px; }
.bsub.locked { font-weight: 600; gap: 8px; align-items: center; }
.bsub.locked svg { width: 14px; height: 14px; flex: 0 0 auto; }
.hero-side { display: grid; gap: 4px; align-content: center; }
.tagline { font-size: clamp(2.2rem, 5vw, 3.4rem); }
.banner { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 16px 24px; align-items: center; padding: 18px; border-radius: 14px; background: var(--ink); color: var(--bg); }
.banner .mono { color: var(--bg); opacity: 0.8; }
.banner h2 { font-size: clamp(2.2rem, 10vw, 4.4rem); margin-top: 4px; overflow-wrap: anywhere; }
.banner p { opacity: 0.85; margin-top: 6px; }
.banner-subs { display: flex; flex-wrap: wrap; gap: 8px; }
.bsub { display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--surface); color: var(--ink); font-weight: 700; min-width: 0; }
.bsub .mono { color: var(--accent); opacity: 1; }
.bsub.done { background: var(--hi); color: var(--hi-ink); }
.bsub .bpick { font-weight: 500; font-size: 0.88rem; }
.topic-body .q { margin-top: 8px; color: var(--muted); }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.cat { display: flex; align-items: baseline; gap: 10px; padding: 11px 14px; background: var(--tint); border-radius: 10px; font-weight: 600; min-width: 0; }
.cat:last-child:nth-child(odd) { grid-column: 1 / -1; }
.cat .mono { color: var(--accent); }
.tomorrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-top: 2px dashed var(--line); }
.lock { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.lock svg { width: 16px; height: 16px; }

/* Sections */
.section { padding-block: 64px; border-top: 1px solid var(--line); }
.section-head { display: grid; gap: 14px; margin-bottom: 32px; }
.section-head h2 { font-size: clamp(2.4rem, 6vw, 4.2rem); max-width: 18ch; }

/* Game console */
.console { background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; padding: 22px 20px; display: grid; gap: 22px; }
.console-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--ink); color: var(--bg); }
.pill.soft { background: var(--tint); color: var(--ink); }
.pill.warn { background: var(--hi); color: var(--hi-ink); }
.namebar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; padding: 16px; background: var(--tint); border-radius: 12px; }
.namebar .note { grid-column: 1 / -1; }
.play-view { padding-block: 28px 64px; }
.setup { display: grid; gap: 18px; max-width: 560px; }
.modes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.mode { display: grid; gap: 14px; align-content: start; padding: 18px; border: 2px solid var(--line); border-radius: 14px; min-width: 0; }
.mode h3 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 1.9rem; line-height: 1; }
.mode p { color: var(--muted); font-size: 0.95rem; }
.mode .or { text-align: center; }
.msg { min-height: 1.4em; font-size: 0.95rem; }
.msg.bad { color: var(--bad); }

.lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.code { font-family: var(--font-display); font-weight: 900; font-size: clamp(3.2rem, 10vw, 5rem); letter-spacing: 0.12em; line-height: 1; }
.copybox { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.copybox input { flex: 1 1 220px; min-width: 0; font-family: var(--font-mono); font-size: 0.8rem; }
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.players li { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; background: var(--tint); border-radius: 999px; min-width: 0; }
.players .pn { font-weight: 700; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.av { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.av { background: var(--pc, var(--accent)); color: var(--p-ink); }
.pc0 { --pc: var(--p0); } .pc1 { --pc: var(--p1); } .pc2 { --pc: var(--p2); } .pc3 { --pc: var(--p3); }
.pc4 { --pc: var(--p4); } .pc5 { --pc: var(--p5); } .pc6 { --pc: var(--p6); } .pc7 { --pc: var(--p7); }
.pdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc, var(--muted)); flex: 0 0 auto; margin-right: 6px; }
.pname { color: var(--pc, inherit); font-weight: 700; }
.sc.tier { border-radius: 6px; font-variant-numeric: tabular-nums; }
.sc.tier.t5 { background: var(--g5); color: var(--g5-ink); }
.sc.tier.t4 { background: var(--g4); color: var(--g4-ink); }
.sc.tier.t3 { background: var(--g3); color: var(--g3-ink); }
.sc.tier.t2 { background: var(--g2); color: var(--g2-ink); }
.sc.tier.t1 { background: var(--g1); color: var(--g1-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.legend .lg { display: inline-flex; align-items: center; font-weight: 700; font-size: 0.92rem; min-width: 0; overflow-wrap: anywhere; }
.legend .sc.tier { padding: 2px 8px; font-family: var(--font-mono); font-size: 0.74rem; }
.tag { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.tag.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Draft */
.draft-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.draft-head h3 { font-size: clamp(2rem, 5vw, 3rem); }
.clock { text-align: right; }
.clock .t { font-family: var(--font-display); font-weight: 900; font-size: 3.4rem; line-height: 0.9; font-variant-numeric: tabular-nums; }
.clock.low .t { color: var(--bad); }
.bar { height: 8px; background: var(--tint); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 0.25s linear; }
.bar.low i { background: var(--bad); }
.order { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.order .o { padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 600; font-size: 0.9rem; }
.order .o { display: inline-flex; align-items: center; gap: 6px; }
.order .o::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--pc, var(--muted)); }
.order .o.on { background: var(--pc, var(--accent)); border-color: var(--pc, var(--accent)); color: var(--p-ink); }
.order .o.on::before { background: currentColor; }
.order .o.me { border-color: var(--accent); }
.lastpick { font-size: 0.95rem; }
.draft-grid { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 24px; align-items: start; }
.pickbox { display: grid; gap: 14px; padding: 16px; background: var(--tint); border-radius: 14px; }
.waitbox { padding: 18px 16px; border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip:disabled { opacity: 0.55; cursor: not-allowed; border-style: dashed; }
.chip svg { width: 13px; height: 13px; }
.combo { position: relative; }
.combo-row { display: flex; gap: 8px; }
.combo-row .field { flex: 1 1 auto; min-width: 0; }
.toggle { min-width: 46px; min-height: 46px; padding: 0; }
.toggle svg { width: 20px; height: 20px; flex: 0 0 auto; transition: transform 0.15s ease; }
.toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.list-head { position: sticky; top: -6px; z-index: 1; margin: -6px -6px 4px; padding: 8px 18px; background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; max-height: 340px; overscroll-behavior: contain; overflow-y: auto; margin: 0; padding: 6px; list-style: none; background: var(--surface); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 0 10px 24px var(--shadow); }
.opt { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
.opt[aria-selected="true"] { background: var(--tint); }
.opt .via { color: var(--muted); font-size: 0.85rem; }
.opt[aria-disabled="true"] { cursor: not-allowed; color: var(--muted); }
.opt[aria-disabled="true"] .nm { text-decoration: line-through; }
.opt .why { font-size: 0.8rem; text-align: right; }
.opt.none { cursor: default; color: var(--muted); }

.board-wrap { overflow-x: auto; border: 2px solid var(--edge); border-radius: 14px; background: var(--surface); }
.board { width: 100%; border-collapse: collapse; min-width: 440px; }
.board th, .board td { padding: 11px 12px; text-align: left; border-top: 1px solid var(--line); vertical-align: middle; }
.board thead th { border-top: 0; background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; font-size: 1.05rem; white-space: nowrap; }
.board thead th.corner { font-family: var(--font-mono); font-weight: 400; font-size: 0.7rem; letter-spacing: 0.12em; }
.board thead th.turn { background: var(--accent); color: var(--accent-ink); }
.board tbody th { position: sticky; left: 0; background: var(--surface); font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 1.2rem; line-height: 1.05; }
.board td .empty { color: var(--muted); }
.board td.mine { background: var(--tint); }
.board thead th[class*="pc"] { box-shadow: inset 0 -5px 0 var(--pc); }
.board thead th.turn[class*="pc"] { background: var(--pc); color: var(--p-ink); }
.board td.has { box-shadow: inset 4px 0 0 var(--pc); }
.board td .auto { color: var(--muted); font-size: 0.78rem; margin-left: 4px; }
.board td .sc { display: inline-block; min-width: 2.8em; margin-right: 6px; padding: 1px 6px; border-radius: 6px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 0.78rem; text-align: center; font-variant-numeric: tabular-nums; }

/* Results */
.winner { display: grid; gap: 8px; padding: 18px; border-radius: 14px; background: var(--hi); color: var(--hi-ink); }
.winner .mono { color: var(--hi-ink); }
.winner.pcw { background: var(--pc, var(--hi)); color: var(--p-ink); }
.winner.pcw .mono { color: var(--p-ink); opacity: 0.85; }
button.bsub { border: 0; font: inherit; font-weight: 700; cursor: pointer; text-align: left; transition: transform 0.12s ease; }
button.bsub:hover { transform: translateY(-2px); }
button.bsub[aria-pressed="true"] { background: var(--hi); color: var(--hi-ink); box-shadow: 0 0 0 3px var(--bg); }
button.bsub[aria-pressed="true"] .mono { color: var(--hi-ink); }
.bhint { flex-basis: 100%; color: var(--bg); opacity: 0.75; }
.t10-focus { display: grid; gap: 10px; padding: 16px; border: 2px solid var(--edge); border-radius: 14px; background: var(--surface); }
.t10-focus-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.t10-focus .t10 { border: 0; padding: 0; }
.t10-focus .t10 h4 { display: none; }
.t10-focus-title { font-size: clamp(1.8rem, 5vw, 2.6rem); }
.winner h3 { font-size: clamp(2.2rem, 6vw, 3.4rem); }
.standings { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.standings li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; }
.standings li.top { border-color: var(--accent); }
.standings .rk { font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1; color: var(--accent); }
.standings .nm { font-weight: 700; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; min-width: 0; }
.standings .avg { padding: 3px 8px; font-family: var(--font-mono); font-size: 0.74rem; white-space: nowrap; }
.standings li[class*="pc"] { box-shadow: inset 5px 0 0 var(--pc); }
.standings .tot { font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.standings .tot small { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-weight: 400; }
.reasons { display: grid; gap: 10px; }
.reason { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.94rem; }
.reason .sc { grid-row: span 2; align-self: start; font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; line-height: 1; color: var(--accent); min-width: 3ch; padding: 6px 8px; text-align: center; font-variant-numeric: tabular-nums; }
.reason .why { color: var(--muted); }
.scorebox { padding: 16px; border-radius: 14px; background: var(--tint); display: grid; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.results-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }

/* How it plays */
.how { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px; padding-block: 20px; border-top: 1px solid var(--line); }
.steps li:last-child { border-bottom: 1px solid var(--line); }

/* ---------- Game-night theme ---------- */
body { background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px); background-size: 22px 22px; font-synthesis: none; }
.display, .wordmark, .mode h3, .card h3, .code, .clock .t, .standings .rk, .standings .tot, .steps .n, .sheet h3, .t10 h4, .board thead th, .board tbody th, .av, .scale b, .reason .sc, .stat b, .cell { font-weight: 400; }
.display { line-height: 0.95; letter-spacing: 0.01em; }
.mono { font-weight: 700; letter-spacing: 0.1em; font-size: 0.7rem; }
.sc, .board td .sc, .t10 li .sc, .legend .sc.tier, .standings .avg { font-weight: 700; }
.wordmark { letter-spacing: 0.02em; font-size: 1.9rem; }
.wordmark i { color: var(--pop); }
.footer .wordmark i { color: var(--pop); }
.mark { background: var(--hi); color: var(--hi-ink); padding: 0.02em 0.18em; border-radius: 0.12em; display: inline-block; transform: rotate(-2deg); box-shadow: 4px 4px 0 var(--drop); }

/* pressable buttons */
.btn { border-radius: 14px; border-width: 2.5px; background: var(--surface); box-shadow: 0 4px 0 var(--drop); transition: transform 0.1s ease, box-shadow 0.1s ease; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--drop); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--drop); }
.btn:disabled, .btn:disabled:hover { box-shadow: 0 2px 0 var(--drop); transform: none; }
.btn.primary { background: var(--accent); border-color: var(--edge); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn.ghost:hover { box-shadow: none; background: var(--tint); }
.field { border-radius: 14px; border-width: 2.5px; background: var(--surface); }
.chip { border-width: 2.5px; box-shadow: 0 3px 0 var(--drop); }
.chip[aria-pressed="true"] { border-color: var(--accent); }
.chip:disabled { box-shadow: none; }

/* hero */
.topic { border: 3px solid var(--edge); border-radius: 24px; box-shadow: 10px 10px 0 var(--pop); transform: rotate(-1deg); }
.topic-head { background: linear-gradient(100deg, var(--grad-a), var(--grad-b)); }
.topic-head .mono { color: var(--grad-ink); }
.topic-title { font-size: clamp(2.6rem, 11vw, 5.6rem); overflow-wrap: break-word; color: var(--ink); }
.cat { background: var(--tint); border-radius: 14px; border: 2px solid transparent; }

.cat:nth-child(5n+2) .mono { color: var(--pop); }
.cat:nth-child(5n+3) .mono { color: #0b8797; }
.cat:nth-child(5n+4) .mono { color: #c45a10; }

.tagline { font-size: clamp(2.4rem, 5.4vw, 3.8rem); }
.tomorrow { border-top: 3px dashed var(--line); }

/* console and banner */
.console { border: 3px solid var(--edge); border-radius: 26px; box-shadow: 8px 8px 0 var(--drop); }
.banner { background: linear-gradient(115deg, var(--grad-a), var(--grad-b)); color: var(--grad-ink); border-radius: 20px; }
.banner .mono { color: var(--grad-ink); }
.banner h2 { text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.18); }
.bhint { color: var(--grad-ink); }

.bsub .mono { color: var(--accent); }
.pill { background: var(--deep); color: var(--deep-ink); font-weight: 700; }
.pill.soft { background: var(--tint); color: var(--ink); }
.namebar { border-radius: 16px; border: 2px dashed var(--accent); background: var(--tint); }
.mode { border: 2.5px solid var(--edge); border-radius: 20px; background: var(--surface); }
.mode h3 { font-size: 2.1rem; color: var(--accent); }
.code { color: var(--accent); text-shadow: 4px 4px 0 var(--hi); }
.players li { border-radius: 999px; }

.list { border-width: 2.5px; border-radius: 16px; }

/* results */

.standings .rk { color: var(--pop); }
.t10 { border: 2.5px solid var(--edge); border-radius: 18px; background: var(--surface); }
.t10 h4 { font-size: 1.6rem; color: var(--accent); }

.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; border: 2.5px solid var(--edge); border-radius: 14px; background: var(--surface); }

/* homepage options: all white; black on hover only where a mouse can hover (not phones) */
.cta-row .btn, #account-btn { background: var(--surface); color: var(--ink); }
@media (hover: hover) and (pointer: fine) {
  .cta-row .btn:hover, #account-btn:hover { background: var(--ink); color: var(--hi); }
}
/* pre-draft countdown */
.countdown { display: grid; justify-items: center; gap: 4px; padding: 22px 16px; border: 3px solid var(--edge); border-radius: 22px; background: var(--hi); color: var(--hi-ink); box-shadow: 6px 6px 0 var(--pop); text-align: center; }

@keyframes cdpop { from { transform: scale(1.35); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .countdown .cd-n.pop { animation: none; } }
/* browse answers while waiting */
.browse { display: grid; gap: 8px; margin-top: 14px; }
.browse-list { list-style: none; margin: 0; padding: 6px; max-height: 320px; overflow-y: auto; overscroll-behavior: contain; border: 2.5px solid var(--edge); border-radius: 16px; background: var(--surface); }

.bopt:nth-child(odd) { background: var(--tint); }

.bopt.taken { color: var(--muted); }

.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.online-opt { display: grid; gap: 8px; padding-top: 14px; border-top: 2px dashed var(--line); }
.online-opt:first-of-type { padding-top: 0; border-top: 0; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px; }
.award { display: grid; gap: 6px; padding: 16px; border: 2.5px solid var(--edge); border-radius: 18px; background: var(--surface); box-shadow: 4px 4px 0 var(--drop), inset 6px 0 0 var(--pc, var(--accent)); min-width: 0; }
.award .badge { justify-self: start; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }

.fast-sub { font-size: clamp(2.2rem, 9vw, 3.6rem); color: var(--accent); }
.fast-list { position: static; margin-top: 8px; max-height: 260px; }
.fast-done-list .bsub { background: var(--tint); }

.share-box { display: grid; gap: 8px; padding: 14px; border: 2px dashed var(--accent); border-radius: 16px; background: var(--tint); }

/* rules */

@media (max-width: 560px) {
  .brand .mono { display: none; }

      <div class="how">
        <div class="card">
          <h3>The draft</h3>
          <ul class="rules">
            <li><span><strong>Snake order.</strong> The order is shuffled at the start and reverses every round.</span></li>
            <li><span><strong>1 minute a pick.</strong> If time runs out, you get a random available answer for your first open subtopic.</span></li>
            <li><span><strong>One answer per subtopic.</strong> Once you fill a subtopic, it's locked for you.</span></li>
            <li><span><strong>No repeats.</strong> Once anyone drafts an answer, nobody can draft it again, under any name. USA and United States count as the same pick.</span></li>
          </ul>
          <div class="snake" aria-label="Example snake order for three players over five rounds">
            <span></span><span class="hd mono">P1</span><span class="hd mono">P2</span><span class="hd mono">P3</span>
            <span class="rd mono">R1</span><span class="cell on">1</span><span class="cell on">2</span><span class="cell on">3</span>
            <span class="rd mono">R2</span><span class="cell">6</span><span class="cell">5</span><span class="cell">4</span>
            <span class="rd mono">R3</span><span class="cell">7</span><span class="cell">8</span><span class="cell">9</span>
            <span class="rd mono">R4</span><span class="cell">12</span><span class="cell">11</span><span class="cell">10</span>
            <span class="rd mono">R5</span><span class="cell">13</span><span class="cell">14</span><span class="cell">15</span>
          </div>
        </div>
        <div class="card">
          <h3>Scoring</h3>
          <p id="score-intro">Claude scores each pick from 1.0 to 10.0 against its subtopic, compared with every other answer that could have been drafted.</p>
          <div class="scale">

  /* ---------- AI scoring ---------- */

  async function runScoring() {
    var g = S.game; if (!g) return;

    render();
    if (!S.env.sample) { await applyResults(g, id, builtinResults(g), ''); return; }
    try {
      var raw = await S.env.sample.json(scoringPrompt(g), { modelTier: 'default' });
      if (!S.game || gameId(S.game) !== id) return;
      var res = normalizeScores(g, raw);

      await applyResults(g, id, { scores: res.scores, summary: res.summary, missing: res.missing, source: 'claude' }, '');

    if (g.mode === 'local') { g.results = doc; render(); return; }
    try { await S.env.db.doc('rooms/' + g.code + '/meta/results').set(doc); }
    catch (e) { S.scoring = { state: 'error', msg: 'Scores didn’t save to the room. Try again.', forGame: id }; render(); }

  /* ---------- offline ---------- */

        '<span class="note">' + (r.name ? (r.rank >= 0 ? '#' + (r.rank + 1) + ' on the list' : 'Not on this list') : (r.skipped ? 'Skipped' : 'Time ran out')) + (top || !topName ? '' : ' · #1 was ' + esc(topName)) + '</span></div>' +
        (r.name ? scoreBadge(r.score) : '<span class="sc tier t1">0.0</span>') + '</li>';
    }).join('');
  }
  function fastShareText() {
    var f = S.fast; if (!f || !f.done) return '';
    var t = TOPICS[f.topicId], used = Math.round((f.finishedAt - f.startedAt) / 1000);
    var dateTxt = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var BLUR = '▒▒▒▒▒▒';
    var lines = ['The Roster · Fast Money ⚡ · ' + dateTxt, 'Topic: ' + BLUR + ' (no spoilers)'];
    lines.push((f.total > FAST_TARGET ? '✅ Beat ' : '❌ Missed ') + fmt1(FAST_TARGET) + ' with ' + fmt1(f.total) + '/50 in ' + used + 's');
    f.results.forEach(function (r) { lines.push((r.name ? TIER_SQUARES[tier(r.score)] : '⬛') + ' ' + BLUR + ' ' + fmt1(r.score) + (r.rank === 0 ? ' ⭐' : '')); });
    lines.push('Can you beat ' + fmt1(FAST_TARGET) + ' in 60 seconds? Today’s Fast Money: ' + SHARE_URL);
    return lines.join('\n');
  }
  async function shareFast() {
    var text = fastShareText(); if (!text) return;
    var ta = $('fast-share-text'), note = $('fast-share-note');
    $('fast-share-box').hidden = false; ta.value = text; ta.rows = text.split('\n').length + 1;
    await copyScore(text, ta, note, $('fast-share-btn'));
  }
  $('fast-in').addEventListener('input', function () { S.ui.fastQ = this.value; S.ui.fastSel = 0; renderFast(); $('fast-in').setAttribute('aria-expanded', String(!!this.value.trim())); });
  $('fast-in').addEventListener('keydown', function (ev) {
    var ms = fastMatches();
    if (ev.key === 'ArrowDown') { ev.preventDefault(); S.ui.fastSel = Math.min(ms.length - 1, S.ui.fastSel + 1); renderFast(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); S.ui.fastSel = Math.max(0, S.ui.fastSel - 1); renderFast(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); if (ms.length) fastSubmit(ms[S.ui.fastSel] ? ms[S.ui.fastSel].e : ms[0].e); }
  });
  $('fast-list').addEventListener('mousedown', function (ev) { var li = ev.target.closest ? ev.target.closest('[data-key]') : null; if (!li) return; ev.preventDefault(); fastSubmit(TOPICS[S.fast.topicId].byKey[li.getAttribute('data-key')]); });
  $('chat-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var inp = $('chat-in'), v = inp.value; inp.value = '';
    sendChat(v); inp.focus();
  });
  /* ---------- boot ---------- */
  async function boot() {
    var saved = store('roster.name'); if (saved) $('player-name').value = clean(saved);
    var m = /^#r-([A-Z]{5})$/i.exec(location.hash || '');
    if (m) { $('room-code').value = m[1].toUpperCase(); S.view = 'play'; S.mode = 'room'; }
    var restored = null, roomCode = null, orgSaved = null;
    try {
      restored = JSON.parse(sessionStorage.getItem('roster.local') || 'null');
      roomCode = sessionStorage.getItem('roster.room');
      orgSaved = sessionStorage.getItem('roster.orgSaved');
      sessionStorage.removeItem('roster.orgSaved');
    } catch (e) {}
    var fr = loadFastToday(); if (!m && fr && !fr.done) { S.fast = fr; S.view = 'play'; S.mode = 'fast'; if (now() >= fr.endsAt) finishFast(); }
    if (!m && restored && restored.game && restored.game.mode === 'local' && TOPICS[restored.game.topicId] && Array.isArray(restored.game.picks)) {
      S.game = restored.game; S.me = 'you'; S.view = 'play';
      S.lastSettings = restored.settings || { mode: 'local', count: 3 };
    }
    renderToday();
    renderLevels(); renderPrivacy();
    render();
    setInterval(function () {
      tick(); fastTick();
      var g = S.game;
      if (g && !g.results && g.mode === 'shared' && !S.waitShown && S.scoreWaitSince && now() - S.scoreWaitSince > 20000 && screenFor() === 'results') { S.waitShown = true; renderResults(); }
    }, 250);
    setInterval(renderToday, 60000);
    var cl = window.claude;
    if (cl && cl.use) {
      try {
        var r = await Promise.all([cl.use('db'), cl.use('user'), cl.use('sample'), cl.use('artifact')]);
        S.env.db = r[0]; S.env.user = r[1]; S.env.sample = r[2]; S.env.artifact = r[3];
        if (S.env.user) {
          S.env.uid = await S.env.user.id();
          try { S.env.canWrite = await S.env.user.can('data.write'); } catch (e) {}
          try { S.env.canEdit = await S.env.user.canEdit(); } catch (e) {}
        }
        if (S.env.canWrite === false) S.env.db = null;
      } catch (e) {}
    } else {
      S.env.web = true;
      S.env.uid = webUid();
      S.env.db = makeWebDb(S.env.uid);
      S.env.orgHash = /^#organizer$/i.test(location.hash || '');
      var nd = document.getElementById('net-diag'); if (nd) { nd.hidden = false; nd.textContent = 'Relay check · version ' + BUILD_ID + ' · not connected yet (connects when you create or join a room)'; }
      checkForUpdate();
      applyWebCopy();
    }
    S.env.ready = true;
    render();
    loadAccount().then(render);
    if (m && S.env.db && S.env.uid) {
      if (myName()) joinRoom(m[1]);
      else setMsg('Enter your name, then tap Join to enter room ' + m[1].toUpperCase() + '.');
    } else if (!S.game && roomCode && S.env.db && S.env.uid) {
      enterRoom(roomCode);
    }
    if (S.env.web && S.env.orgHash && !S.game) openOrganizer();
    if (orgSaved !== null && orgAllowed() && !S.game) {
      S.org.draft = null;
      openOrganizer();
      var ok = orgSaved === canon(futureOnly(SCHEDULE.days)) + '|' + canon(futureOnly(SCHEDULE.fast || {}));
      orgMsg(ok ? 'Schedule saved.' : 'Your changes didn’t save. Make them again, then save.', !ok);
    }
  }
  boot();
})();
</script>
